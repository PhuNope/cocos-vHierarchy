name: Publish vHierarchy 0.1.2

# Release is initiated only by explicitly committing this workflow file after
# user approval. Subsequent source pushes cannot trigger another release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'PhuNope/cocos-vHierarchy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved release source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck, test, and package v0.1.2
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run pack:local
          mv vHierarchy-0.1.2-test.zip vHierarchy-0.1.2.zip
      - name: Verify release ZIP imports directly and is Patch 51
        run: |
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          archive='vHierarchy-0.1.2.zip'
          with ZipFile(archive) as z:
              names=z.namelist()
              assert len(names)>20, 'Incomplete extension ZIP'
              assert all(p.startswith('cocos-vhierarchy/') for p in names), 'Unexpected ZIP root'
              assert not any(p.lower().endswith('.zip') for p in names), 'Nested ZIP detected'
              manifest='cocos-vhierarchy/package.json'
              assert manifest in names, 'Missing manifest'
              assert 'cocos-vhierarchy/dist/main.js' in names, 'Missing main entry'
              renderer='cocos-vhierarchy/dist/renderer/renderer.js'
              assert renderer in names, 'Missing renderer'
              pkg=json.loads(z.read(manifest))
              assert pkg['name']=='cocos-vhierarchy', 'Wrong extension'
              assert pkg['version']=='0.1.2', 'Wrong version'
              assert '0.1.2-patch51-ctrl-right-palette' in z.read(renderer).decode('utf-8'), 'Wrong renderer'
          print('Verified direct-import v0.1.2 ZIP:',len(names),'files')
          PY
      - name: Create v0.1.2 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo 'Release v0.1.2 already exists: not overwriting.'
            exit 1
          fi
          if gh api repos/${{ github.repository }}/git/ref/tags/v0.1.2 >/dev/null 2>&1; then
            echo 'Tag v0.1.2 already exists: refusing to overwrite.'
            exit 1
          fi
          gh release create v0.1.2 \
            ./vHierarchy-0.1.2.zip \
            --title 'vHierarchy 0.1.2' \
            --notes-file .github/release-notes/v0.1.2.md \
            --target "$GITHUB_SHA" \
            --latest
      - name: Verify published release ZIP byte-for-byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          gh release download v0.1.2 --pattern 'vHierarchy-0.1.2.zip' --dir published
          cmp -s vHierarchy-0.1.2.zip published/vHierarchy-0.1.2.zip
          echo 'Published ZIP matches verified direct-import ZIP.'

name: Build vHierarchy test ZIP (no release)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.*.json'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build and run tests
        run: npm test
      - name: Package installable test ZIP
        run: npm run pack:local
      # GitHub Actions always wraps uploaded artifacts in a ZIP. Uploading
      # the ZIP from pack:local would produce zip-inside-zip. Stage the actual
      # Cocos extension files instead, so the downloaded artifact ZIP itself
      # is importable directly into Cocos Creator.
      - name: Stage directly importable plugin contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('vHierarchy-0.1.1-test.zip')
          stage = Path('.installable-artifact')
          with ZipFile(archive) as z:
              names = z.namelist()
              assert 'cocos-vhierarchy/package.json' in names, 'Extension manifest is missing'
              assert not any(name.lower().endswith('.zip') for name in names), 'Nested ZIP is forbidden'
              assert all(name.startswith('cocos-vhierarchy/') for name in names), 'Unexpected ZIP root'
              z.extractall(stage)
          assert (stage / 'cocos-vhierarchy/package.json').is_file()
          assert (stage / 'cocos-vhierarchy/dist/main.js').is_file()
          print('Prepared direct-import archive contents')
          PY
      - name: Upload directly importable test ZIP (no nested archive, no release)
        uses: actions/upload-artifact@v4
        with:
          name: vHierarchy-test-${{ github.run_number }}
          path: .installable-artifact/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
